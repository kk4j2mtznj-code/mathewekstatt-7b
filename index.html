<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathewerkstatt 7b · Fit für die Klassenarbeit</title><style>:root,.dark{--background:#111214;--foreground:#f7f5f0;--card:#1b1d20;--card-foreground:#f7f5f0;--popover:#242629;--popover-foreground:#fff;--primary:#ff9b42;--primary-foreground:#111;--secondary:#27292c;--secondary-foreground:#fff;--muted:#242629;--muted-foreground:#bfc0c3;--accent:#33302a;--accent-foreground:#fff;--border:#3c3e42;--input:#505259;--ring:#ff9b42;--radius:1rem}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--foreground);font-family:Arial,sans-serif;font-size:16px;line-height:1.55}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:default;opacity:.5}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ffbc7c;outline-offset:4px}a{color:#ffc18c}header{border-bottom:1px solid #34363a;padding:20px max(24px,calc((100vw - 1320px)/2));display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-weight:800;font-size:20px;display:flex;align-items:center;gap:12px}.mark{background:#ff9b42;color:#151515;border-radius:12px;padding:7px 12px;font-size:22px}header small{color:#bfc0c3;font-size:14px}.shell{max-width:1370px;margin:auto;padding:32px 24px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px}.side h2,.eyebrow{color:#ffb16d;font-size:14px;letter-spacing:.1em;text-transform:uppercase}.topic{display:block;text-align:left;width:100%;border:1px solid transparent;background:transparent;color:#e2e2e3;padding:13px 15px;border-radius:12px;margin:4px 0}.topic small{display:block;color:#adafb4;font-size:14px}.topic.active{background:#2d241d;border-color:#a76530;color:#ffc28b}.topic:hover{background:#25272a}.side .exitnav{margin-top:22px;border:1px solid #a76530}.download{margin-top:24px;border-top:1px solid #3a3c41;padding-top:20px;font-size:14px}.download a{display:block;margin:10px 0}.topline{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:clamp(28px,3vw,40px);line-height:1.15;margin:5px 0 14px;letter-spacing:-.03em}h2{font-size:22px}.muted{color:#bfc0c3}.lead{margin:0 0 22px;max-width:650px}.levelbar{margin-bottom:22px}.levelbar [role=tablist]{height:auto;padding:5px;background:#202226;border:1px solid #414349}.levelbar [role=tab]{font-size:22px;min-width:85px;min-height:48px;letter-spacing:3px;color:#c3c4c7}.levelbar [role=tab][data-state=active]{background:#ff9b42;color:#191919}.statusline{display:flex;justify-content:space-between;gap:15px;border-block:1px solid #34363a;padding:15px 0;margin:22px 0}.taskgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.qcard{background:#1c1e21;border:1px solid #3c3e42;border-radius:17px;padding:23px;display:flex;flex-direction:column;gap:16px}.qcard.ok{border-color:#6fb999}.qcard.no{border-color:#e3a05f}.qtop{display:flex;justify-content:space-between;color:#bbbec4;font-size:14px}.number{color:#ffb16d;font-weight:bold}.formula{font-size:21px;line-height:1.9;min-height:48px;color:#fff}.frac{display:inline-flex;vertical-align:middle;flex-direction:column;text-align:center;line-height:1.15; margin:0 .2em;min-width:1.1em;font-variant-numeric:tabular-nums}.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 .12em .13em}.frac>span:last-child{padding:.13em .12em 0}.answer{display:flex;align-items:center;gap:12px}.answer input{min-width:0;width:100%;background:#111315;border:1px solid #61646b;border-radius:10px;color:#fff;padding:12px;font-size:18px}.answer label{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}.unit{color:#c8c9cb}.choices{display:grid;gap:8px}.choice{width:100%;text-align:left;padding:11px;border:1px solid #5a5d63;border-radius:8px;background:#242629;color:#fff}.choice.selected{border-color:#ffa755;background:#3b2c20}.feedback{font-size:16px;color:#a1e4c2}.no .feedback{color:#ffd1a4}details{border-top:1px solid #3f4247;padding-top:12px;font-size:15px}summary{cursor:pointer;color:#ffbf85}details p{margin-bottom:0}details ol{padding-left:25px}details li{margin:10px 0}.diagram{display:flex;max-width:300px;height:52px;border:1px solid #ddd}.diagram span{flex:1;border-right:1px solid #e2e2e2}.diagram .filled{background:#ff9b42}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:24px 0}.btn{border:1px solid #62656b;border-radius:10px;padding:13px 20px;background:#272a2e;color:white;font-weight:700}.btn.primary{background:#ff9b42;color:#171717;border-color:#ff9b42}.result{border:1px solid #8d6541;background:#28221d;border-radius:16px;padding:24px;margin-bottom:24px}.result h2{margin:0 0 12px}.result li{margin:10px 0}.result button{margin:8px 10px 0 0}.book{font-size:14px;color:#bfc0c3}.note{font-size:14px;color:#c1c2c6;padding:16px;border:1px solid #414349;border-radius:10px}.footer{max-width:1320px;margin:0 auto;padding:25px;border-top:1px solid #3c3e42;color:#aeb1b7;font-size:14px}.error{color:#ffc6b0}.loading{padding:60px;font-size:24px}
@media(max-width:950px){.shell{grid-template-columns:210px minmax(0,1fr);gap:22px}.taskgrid{grid-template-columns:1fr}}@media(max-width:650px){header{padding:16px}header small{display:none}.shell{display:block;padding:20px 16px}.side{margin-bottom:28px}.topiclist{display:flex;overflow:auto;gap:8px;padding-bottom:10px}.topic{min-width:170px;margin:0}.topic small{font-size:14px}.side .exitnav{margin-top:10px}.download{display:flex;gap:20px;padding-top:5px;margin-top:10px}.download a{font-size:14px}.side h2{margin-top:0}.qcard{padding:20px}.formula{font-size:20px}.levelbar [role=tab]{min-width:78px}}

.levelbar{display:flex;gap:6px}.levelbar .btn{padding:10px;font-size:21px;letter-spacing:2px}.choice input{accent-color:#ff9b42;width:18px;height:18px;vertical-align:middle}.choice{cursor:pointer}</style></head><body><div id="app"></div><noscript>Bitte JavaScript aktivieren, um die Übungen zu nutzen.</noscript><script>const topics=[['kopf','Kopfrechnen','Grundrechenarten','Heft: Einmaleins und Umkehraufgaben'],['schrift','Schriftlich rechnen','Alle vier Rechenarten','Heft: Schriftliche Rechenverfahren'],['grund','Brüche verstehen','Darstellen, erweitern, kürzen','Buch S. 8; S. 14 Beispiele 2/3'],['plus','Plus & Minus','Gleichnamig machen','Buch S. 9 Nr. 2/4; S. 10 Nr. 9'],['gemischt','Gemischte Zahlen','Ganze und Bruchteile','Buch S. 10 Nr. 11/12; S. 11 Nr. 13'],['mal','Brüche malnehmen','Zähler mal Zähler','Buch S. 14; S. 15 Nr. 3/4/6'],['geteilt','Brüche teilen','Mit dem Kehrwert rechnen','Buch S. 17; S. 18 Nr. 1/2/5'],['groessen','Anteile von Größen','Zeit, Geld und Gewicht','Buch S. 12 Nr. 2/3; S. 13 Nr. 6/10'],['regeln','Rechenregeln','Fehler und Punkt vor Strich','Buch S. 9 Nr. 6; S. 26 Nr. 26/27'],['sach','Sachaufgaben','Rechnen im Alltag','Buch S. 21 Nr. 9/13; S. 24 Nr. 15']]         ;
                                                                                                                                                                          
function rng(seed       ){return ()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};}
const gcd=(a       ,b       )       =>b?gcd(b,a%b):a;
function frac(n       ,d       ){const g=gcd(Math.abs(n),d);return d/g===1?String(n/g):`${n/g}/${d/g}`;}
function parseAnswer(raw       ){let s=raw.trim().replace(/−/g,'-').replace(/,/g,'.').replace(/\s*(€|Euro|Minuten|min|Gramm|g|Kilogramm|kg|Liter|l|Gläser)\s*$/i,'').trim();if(/^[-+]?\d+(\.\d+)?$/.test(s))return Number(s);let m=s.match(/^(\d+)\s+(\d+)\s*\/\s*(\d+)$/);if(m&&+m[3])return +m[1]+ +m[2]/+m[3];m=s.match(/^([-+]?\d+)\s*\/\s*(\d+)$/);return m&&+m[2]?+m[1]/+m[2]:NaN;}
const correct=(q  ,s       )=>Number.isFinite(parseAnswer(s))&&Math.abs(parseAnswer(s)-q.answer)<1e-8;
function generate(topic       ,level       ,seed       ,count=6)    {const r=rng(seed),int=(a       ,b       )=>a+Math.floor(r()*(b-a+1));return Array.from({length:count},(_,i)=>{
let a=int(2,8),b=int(2,6),d=int(3,9),n=int(1,d-1);let q  ={id:`${topic}-${seed}-${i}`,topic,prompt:'',answer:0,solution:[],tip:'Notiere den Rechenweg auf Papier.',points:1};
const set=(p       ,ans       ,steps         ,tip       )=>Object.assign(q,{prompt:p,answer:ans,solution:steps,tip});
if(topic==='kopf'){let op=['·',':','+','−'][i%4];if(level>1){a=int(11,level===2?20:35);b=int(2,12);}let x=op===':'?a*b:op==='−'?a+b:a,ans=op==='·'?a*b:op===':'?a:op==='+'?a+b:a;set(`${x} ${op} ${b} = ?`,ans,[`${x} ${op} ${b} = ${ans}`],op===':'?`Welche Zahl mal ${b} ergibt ${x}?`:'Zerlege die Zahlen in einfache Teilschritte.');}
else if(topic==='schrift'){let x=int(level===1?100:1000,level===1?900:7000),y=int(12,level===1?89:999),op=['+','−','·',':'][i%4];if(op==='·'){x=int(102,level===1?299:699);y=level===1?int(2,8):int(12,39);}if(op===':'){y=int(3,9);x=int(102,level===1?299:899)*y;}if(x<y)[x,y]=[y,x];let ans=op==='+'?x+y:op==='−'?x-y:op==='·'?x*y:x/y;set(`${x} ${op} ${y} = ?`,ans,[op==='·'?`${x} · ${Math.floor(y/10)*10} + ${x} · ${y%10} = ${ans}`:`${x} ${op} ${y} = ${ans}`,op===':'?`Probe: ${ans} · ${y} = ${x}`:op==='−'?`Probe: ${ans} + ${y} = ${x}`:'Achte auf Stellenwerte und Überträge.'],'Rechne schriftlich auf Papier. Trage anschließend das Ergebnis ein.');}
else if(topic==='grund'){if(i%3===0){q.diagram={n,d};set('Welcher Anteil ist orange markiert?',n/d,[`${n} von ${d} gleich großen Teilen: ${n}/${d}.`],'Der Nenner zählt alle Teile, der Zähler die markierten.');}else if(i%3===1){let k=level+1;set(`Erweitere ${n}/${d} mit ${k}. Welcher Zähler entsteht?`,n*k,[`Zähler: ${n} · ${k} = ${n*k}`,`Nenner: ${d} · ${k} = ${d*k}`,`${n}/${d} = ${n*k}/${d*k}`],'Multipliziere Zähler und Nenner mit derselben Zahl. Gefragt ist nur der Zähler.');}else{let k=level+1;set(`Kürze ${n*k}/${d*k} vollständig.`,n/d,[`Durch ${k} teilen: ${n}/${d}`,`Vollständig gekürzt: ${frac(n,d)}`],'Teile Zähler und Nenner durch dieselbe Zahl.');}}
else if(topic==='plus'||topic==='gemischt'){let e=level===1?d:level===2?d*2:int(3,9),m=int(1,e-1),sub=i%2===1;if(sub&&n/d<m/e){[n,m]=[m,n];[d,e]=[e,d];}let w=topic==='gemischt'?int(2,5):0,v=topic==='gemischt'?int(1,2):0,num=(w*d+n)*e+(sub?-1:1)*(v*e+m)*d,den=d*e;set(`${w?w+' ':''}${n}/${d} ${sub?'−':'+'} ${v?v+' ':''}${m}/${e} = ?`,num/den,[`Gleichnamige Bruchanteile: ${n*e}/${den} und ${m*d}/${den}`,`Ganze und Bruchanteile ${sub?'subtrahieren':'addieren'}.`,`Ergebnis: ${frac(num,den)}`],'Mache die Brüche zuerst gleichnamig. Der gemeinsame Nenner bleibt stehen.');}
else if(topic==='mal'||topic==='geteilt'){let e=level===1?1:int(2,7),m=level===1?int(2,5):level===2?1:int(1,e-1),div=topic==='geteilt',num=div?n*e:n*m,den=div?d*m:d*e;set(`${n}/${d} ${div?':':'·'} ${e===1?m:`${m}/${e}`} = ?`,num/den,div?[`Kehrwert des Teilers: ${e}/${m}`,`Multiplizieren: ${n}/${d} · ${e}/${m}`,`Ergebnis: ${frac(num,den)}`]:[`Zähler: ${n} · ${m} = ${num}`,`Nenner: ${d} · ${e} = ${den}`,`Ergebnis: ${frac(num,den)}`],div?'Drehe nur den Teiler um. Dann wird aus Geteilt ein Malzeichen.':'Multipliziere Zähler mit Zähler und Nenner mit Nenner.');}
else if(topic==='groessen'){if(level===3&&i%2===0){let total=d*int(4,12),part=total*n/d;q.unit='€';set(`${n}/${d} des Geldes sind ${part} €. Wie groß ist der ganze Betrag?`,total,[`Ein Teil: ${part} € : ${n} = ${total/d} €`,`Das Ganze: ${total/d} € · ${d} = ${total} €`],'Teile durch den Zähler. Multipliziere dann mit dem Nenner.');}else{d=[2,4,5,10][i%4];n=int(1,d-1);let time=i%2===0,total=time?60:1000;q.unit=time?'min':'g';set(`${n}/${d} ${time?'Stunde':'Kilogramm'} sind wie viele ${time?'Minuten':'Gramm'}?`,total*n/d,[`1 ${time?'h = 60 min':'kg = 1 000 g'}`,`${total} : ${d} · ${n} = ${total*n/d} ${q.unit}`],'Wandle zuerst das Ganze in die kleinere Einheit um. Teile dann durch den Nenner.');}}
else if(topic==='regeln'){if(level===1||i%2===0){q.choices=['Zähler und Nenner addieren','Zuerst gleichnamig machen','Nur die Nenner addieren'];set(`Wie rechnest du ${n}/${d} + 1/${d+1} richtig?`,1,['Zuerst gleichnamig machen. Dann Zähler addieren. Der Nenner bleibt.'],'Die Stücke müssen gleich groß sein.');}else{set(`1/${d} + ${n}/${d} · 1/2 = ?`,(n+2)/(2*d),[`Zuerst multiplizieren: ${n}/${d} · 1/2 = ${n}/${2*d}`,`1/${d} = 2/${2*d}`,`Ergebnis: ${frac(n+2,2*d)}`],'Punkt vor Strich: Rechne zuerst die Multiplikation.');}}
else{if(i%3===0){d=level===1?2:4;n=level===1?1:3;let breads=int(2,6);q.unit='kg';set(`Für ein Brot brauchst du ${n}/${d} kg Mehl. Wie viel brauchst du für ${breads} Brote?`,n*breads/d,[`${breads} · ${n}/${d} = ${frac(n*breads,d)}`,`Du brauchst ${frac(n*breads,d)} kg Mehl.`],'Mehrere gleiche Mengen: multiplizieren.');}else if(i%3===1){d=level===1?4:8;n=int(2,d-1);q.unit='Gläser';set(`In einer Kanne sind ${n}/${d} Liter Saft. Ein Glas fasst 1/${d} Liter. Wie viele volle Gläser kannst du füllen?`,n,[`${n}/${d} : 1/${d} = ${n}/${d} · ${d} = ${n}`,`Es sind ${n} volle Gläser.`],'Teile die Gesamtmenge durch den Glasinhalt.');}else{let total=d*int(3,9);q.unit='€';set(`Du hast ${total} €. ${n}/${d} davon sparst du. Wie viel Geld bleibt übrig?`,total-total*n/d,[`Sparen: ${total} : ${d} · ${n} = ${total*n/d} €`,`Rest: ${total} − ${total*n/d} = ${total-total*n/d} €`],'Berechne zuerst den gesparten Anteil. Ziehe ihn vom Ganzen ab.');}}
return q;});}
function exitQuestions(seed       ){return topics.map(([id],i)=>({...generate(id,i<3?1:2,seed+i*101,6)[(seed+i)%6],points:2}));}

const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const math=s=>esc(s).replace(/(\d+)\/(\d+)/g,'<span class="frac"><span>$1</span><span>$2</span></span>');
let topic='kopf',level=1,mode='practice',qs=[],answers=[],checked=false,mastered={};
function start(t=topic,l=level,m=mode){topic=t;level=l;mode=m;const seed=Math.floor(Math.random()*4294967295);qs=m==='exit'?exitQuestions(seed):generate(t,l,seed);answers=qs.map(()=>'');checked=false;render();}
function render(){const current=topics.find(t=>t[0]===topic),score=qs.reduce((s,q,i)=>s+(correct(q,answers[i])?q.points:0),0),total=qs.reduce((s,q)=>s+q.points,0),wrong=[...new Set(qs.filter((q,i)=>!correct(q,answers[i])).map(q=>q.topic))];
document.getElementById('app').innerHTML=`<header><div class="brand"><span class="mark">½</span><span>Mathewerkstatt <span style="color:#ffb16d">7b</span></span></div><small>Fit für die Klassenarbeit · Brüche</small></header><div class="shell"><aside class="side"><h2>Dein Training</h2><nav class="topiclist" aria-label="Themen">${topics.map(([id,name,sub],i)=>`<button class="topic ${topic===id&&mode==='practice'?'active':''}" data-topic="${id}"><span style="color:#ffb16d;margin-right:8px">${String(i+1).padStart(2,'0')}</span>${name}<small>${sub}</small></button>`).join('')}</nav><button class="topic exitnav ${mode==='exit'?'active':''}" id="exit">↗ Exit-Ticket<small>10 Aufgaben · 20 Punkte</small></button></aside><main><div class="topline"><div><div class="eyebrow">${mode==='exit'?'Dein Abschluss':'Üben · Verstehen · Weiterkommen'}</div><h1>${mode==='exit'?'Was sitzt schon?':current[1]}</h1></div>${mode==='practice'?`<div class="levelbar" role="group" aria-label="Schwierigkeitsgrad">${[1,2,3].map(l=>`<button class="btn ${l===level?'primary':''}" data-level="${l}" aria-label="Niveau ${l}" aria-pressed="${l===level}">${'★'.repeat(l)}${'☆'.repeat(3-l)}</button>`).join('')}</div>`:''}</div><p class="lead muted">${mode==='exit'?'Bearbeite die Aufgaben ohne Tipps. Danach erhältst du Punkte und persönliche Übungsempfehlungen.':'Notiere den Rechenweg auf Papier. Prüfe deine Ergebnisse und nutze einen Tipp, wenn du nicht weiterkommst.'}</p><div class="note">Antworten als Bruch <strong>3/4</strong>, gemischte Zahl <strong>1 1/2</strong> oder Dezimalzahl <strong>0,75</strong>. Gleichwertige Ergebnisse werden akzeptiert. Kürze beim Rechnen möglichst vollständig.</div><div class="statusline"><span>${mode==='exit'?'Exit-Ticket':`Niveau ${'★'.repeat(level)} · ${mastered[topic+'-'+level]?'Schon einmal vollständig richtig':'Neue Übungsrunde'}`}</span><span id="count">${answers.filter(a=>a.trim()).length} / ${qs.length} bearbeitet</span></div>
${checked?`<section class="result" aria-live="polite"><h2>${score} / ${total} ${mode==='exit'?'Punkte':'richtig'}</h2><p>${score===total?'Alles richtig! Du kannst neue Aufgaben oder ein höheres Niveau ausprobieren.':'Hier lohnt sich weiteres Üben:'}</p>${wrong.length?`<ul>${wrong.map(id=>{const t=topics.find(t=>t[0]===id);return `<li><strong>${t[1]}:</strong> ${esc(qs.find(q=>q.topic===id).tip)}<br><span class="book">${t[3]}</span></li>`;}).join('')}</ul>`:''}${mode==='exit'?'<p>Dein Exit-Ticket wurde auf diesem Gerät ausgewertet. Die Ergebnisse werden nicht gespeichert oder an den Lehrer übermittelt.</p>':''}<div class="actions"><button class="btn primary" data-new>${mode==='exit'?'Exit-Ticket wiederholen':'Sechs neue Aufgaben'}</button>${mode==='practice'&&score===total&&level<3?'<button class="btn" id="next">Nächstes Niveau</button>':''}</div></section>`:''}
<div class="taskgrid">${qs.map((q,i)=>`<section class="qcard ${checked?(correct(q,answers[i])?'ok':'no'):''}"><div class="qtop"><span class="number">${String(i+1).padStart(2,'0')}</span><span>${mode==='exit'?topics.find(t=>t[0]===q.topic)[1]+' · 2 P':'Aufgabe'}</span></div><div class="formula">${math(q.prompt)}</div>${q.diagram?`<div class="diagram" role="img" aria-label="${q.diagram.n} von ${q.diagram.d} Teilen markiert">${Array.from({length:q.diagram.d},(_,j)=>`<span class="${j<q.diagram.n?'filled':''}"></span>`).join('')}</div>`:''}${q.choices?`<div class="choices" role="group" aria-label="Antwort zu Aufgabe ${i+1}">${q.choices.map((text,j)=>`<label class="choice ${answers[i]===String(j)?'selected':''}"><input type="radio" name="q${i}" data-answer="${i}" value="${j}" ${answers[i]===String(j)?'checked':''} ${checked?'disabled':''}> ${esc(text)}</label>`).join('')}</div>`:`<div class="answer"><label for="q${i}">Antwort Aufgabe ${i+1}</label><input id="q${i}" data-answer="${i}" autocomplete="off" maxlength="80" placeholder="Dein Ergebnis" value="${esc(answers[i])}" ${checked?'disabled':''}>${q.unit?`<span class="unit">${q.unit}</span>`:''}</div>`}${checked?`<div class="feedback">${correct(q,answers[i])?'✓ Richtig.':'↺ Noch nicht richtig. Schau dir den Rechenweg an.'}</div><details ${!correct(q,answers[i])?'open':''}><summary>Rechenweg & Buchhinweis</summary><ol>${q.solution.map(s=>`<li>${math(s)}</li>`).join('')}</ol><p class="book">${topics.find(t=>t[0]===q.topic)[3]}</p></details>`:mode==='practice'?`<details><summary>Tipp anzeigen</summary><p>${esc(q.tip)}</p><p class="book">${current[3]}</p></details>`:''}</section>`).join('')}</div>${!checked?`<div class="actions"><button class="btn primary" id="check">${mode==='exit'?'Exit-Ticket auswerten':'Ergebnisse prüfen'}</button><button class="btn" data-new>Neue Aufgaben</button></div>`:''}<p id="error" class="error" role="alert"></p><p class="book">${mode==='exit'?'Ohne Anmeldung und Namenseingabe. Beliebig oft wiederholbar. Die Auswertung erfolgt nur auf diesem Gerät; es gibt keine zentrale Abgabe.':current[3]+' · Bei zwei Aufgabenspalten: linke, orange Spalte.'}</p></main></div><footer class="footer">Mathematik 7b · OBS Deegfeld · Rechne in deinem Tempo. Erst selbst versuchen, dann vergleichen.</footer>`;
document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(b.dataset.topic,level,'practice'));
document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>start(topic,+b.dataset.level,'practice'));
document.querySelectorAll('[data-new]').forEach(b=>b.onclick=()=>start());
document.getElementById('exit').onclick=()=>start(topic,level,'exit');
const next=document.getElementById('next');if(next)next.onclick=()=>start(topic,level+1,'practice');
document.querySelectorAll('[data-answer]').forEach(el=>el.addEventListener('input',()=>{answers[+el.dataset.answer]=el.value;document.getElementById('count').textContent=answers.filter(a=>a.trim()).length+' / '+qs.length+' bearbeitet';if(el.type==='radio'){el.closest('.choices').querySelectorAll('.choice').forEach(l=>l.classList.toggle('selected',l.querySelector('input').checked));}}));
const check=document.getElementById('check');if(check)check.onclick=()=>{if(answers.some(a=>!a.trim())){document.getElementById('error').textContent='Bearbeite zuerst alle Aufgaben.';return;}checked=true;if(qs.every((q,i)=>correct(q,answers[i])))mastered[topic+'-'+level]=true;render();document.querySelector('.result').scrollIntoView({behavior:'smooth',block:'start'});};
}
start();
</script></body></html>
